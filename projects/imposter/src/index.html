<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="ad.size" content="width=320,height=480">
<title>Imposter</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="stage">
  <svg id="world" xmlns="http://www.w3.org/2000/svg" viewBox="60 -300 880 1700" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <div class="vignette" aria-hidden="true"></div>

  <header class="hud">
    <div class="logo"><b id="logoText">IMPOSTER</b><span id="taglineText"></span></div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="question" id="question" hidden></div>

  <div class="choices" id="choices" hidden>
    <div class="row">
      <button class="vote p1" id="voteP1" type="button"><i></i><span></span></button>
      <button class="vote p2" id="voteP2" type="button"><i></i><span></span></button>
    </div>
    <button class="keep" id="keepBtn" type="button"></button>
  </div>

  <div class="secret" id="secret">
    <div class="secret-word">
      <small>SECRET WORD</small>
      <strong id="secretWord"></strong>
    </div>
    <div class="timer" id="timer">
      <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" class="track"/><circle cx="22" cy="22" r="19" class="fill" id="timerRing"/></svg>
      <span id="timerText">0:20</span>
    </div>
  </div>

  <div class="stamp" id="stamp" hidden>TIME'S UP!</div>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <div class="end" id="end" hidden>
    <div class="end-card">
      <h1 id="endTitle"></h1>
      <p id="endSub"></p>
      <button class="cta" id="ctaBtn" type="button">TRY AGAIN</button>
    </div>
  </div>

</div>

<script src="config.js"></script>
<script src="../../../shared/playable-sdk.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
